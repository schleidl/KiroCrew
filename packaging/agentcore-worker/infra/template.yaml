#
# AgentCore worker infrastructure, as CloudFormation rather than a CDK app: the
# repository's AWS invariant is that every interaction shells the AWS CLI, and the
# deploy is a human action.
#
# This template re-renders the resource inventory of the reference CDK stack
# (pi-cloud-mode-extension/cdk/cloud-mode-stack.ts) with every account-specific
# value as a PARAMETER. There is no account id, ARN, region string or secret value
# anywhere in this file; account and region are referenced only through the
# AWS::AccountId / AWS::Region / AWS::Partition pseudo parameters, which resolve
# at deploy time in whatever account and region the operator points at.
#
# DELIBERATELY DROPPED from the reference stack: its Bedrock-only "agent role"
# (and the runtime role's sts:AssumeRole on it, and the loopback credential
# broker's CLOUD_MODE_AGENT_ROLE_ARN wiring). That role existed because the pi
# worker's model traffic was SigV4 to bedrock:InvokeModel, so the traffic needed
# an identity narrower than the runtime role. kiro-cli does not talk to Bedrock:
# it authenticates to Kiro with a bearer token taken from KIRO_API_KEY, over
# plain HTTPS with no AWS identity involved. A Bedrock-invoke role here would
# grant a permission nothing uses and would still have to be assumable by the
# runtime role - dead weight that widens the blast radius instead of narrowing
# it. The split it implemented is replaced by keeping the model credential out of
# the untrusted process's environment, which is the worker's job, not IAM's.
#
# Also dropped: the reference stack's opt-in VPC + Network Firewall egress
# allow-list. Its ~20 resources are out of scope for this template; the runtime's
# NetworkMode is a parameter, so the VPC variant is reachable by supplying
# pre-existing subnets and security groups (see the NetworkMode parameter).

AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AgentCore worker: ECR repository, arm64 image build project, AgentCore runtime,
  runtime and operator roles, secret shells, transcript bucket, log group, budget.

Metadata:
  # W1030: VpcSubnetIds / VpcSecurityGroupIds default to empty because the default
  # PUBLIC network mode needs neither, and cfn-lint resolves that empty default
  # against the subnet/security-group id patterns in the VPC branch of the Fn::If
  # that PUBLIC never selects. NetworkMode=VPC without real ids fails at deploy
  # time regardless, so the check has nothing to protect here.
  cfn-lint:
    config:
      ignore_checks: [W1030]
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Naming }
        Parameters: [ResourceSuffix, AgentRuntimeName, EcrRepositoryName, LogGroupName]
      - Label: { default: Image }
        Parameters: [ImageTag, ImageTagMutability, KiroCliUrl, KiroCliSha256]
      - Label: { default: "Bring-up phase (see CreateRuntime)" }
        Parameters: [CreateRuntime]
      - Label: { default: Build project }
        Parameters: [SourceType, SourceLocation, BuildSpecPath, BuildImage, BuildComputeType]
      - Label: { default: Runtime network }
        Parameters: [NetworkMode, VpcSubnetIds, VpcSecurityGroupIds]
      - Label: { default: Secrets (shells only - values are written out of band) }
        Parameters:
          [KiroApiKeySecretName, ForgeAppIdSecretName, ForgeInstallationIdSecretName, ForgePrivateKeySecretName]
      - Label: { default: Behaviour }
        Parameters: [MaxActiveSessions, ValidateCommand, SessionTtlSeconds]
      - Label: { default: "Retention, cost and access" }
        Parameters:
          [TranscriptRetentionDays, LogRetentionDays, MonthlyBudgetUsd, BudgetEmail, OperatorPrincipalArn]

Parameters:
  ResourceSuffix:
    Type: String
    Default: ""
    AllowedPattern: "^[A-Za-z0-9-]*$"
    Description: >-
      Appended to globally named resources so an isolated test stack can live
      beside a live one. Empty keeps the base names.

  AgentRuntimeName:
    Type: String
    Default: agentcore_worker
    AllowedPattern: "^[A-Za-z][A-Za-z0-9_]{0,47}$"
    Description: AgentCore runtime name. Underscores only - hyphens are rejected by the service.

  EcrRepositoryName:
    Type: String
    Default: agentcore-worker
    AllowedPattern: "^[a-z0-9][a-z0-9._/-]*$"

  LogGroupName:
    Type: String
    Default: /agentcore-worker/worker
    Description: Log group the worker writes its own lines to (AgentCore also creates its own).

  ImageTag:
    Type: String
    Default: latest
    Description: >-
      Tag the build project pushes and the runtime pulls. Prefer an immutable tag
      (a commit sha) over "latest" for anything but a first bring-up.

  ImageTagMutability:
    Type: String
    Default: IMMUTABLE
    AllowedValues: [IMMUTABLE, MUTABLE]
    Description: >-
      IMMUTABLE means a tag can never be repointed after review, so the runtime
      cannot be swapped underneath without a new tag. Use MUTABLE only while
      iterating with ImageTag=latest.

  KiroCliUrl:
    Type: String
    Default: ""
    Description: >-
      URL of the aarch64 musl kiro-cli release archive, passed to the build as a
      --build-arg. REQUIRED for a build. Deliberately has no default, but NOT
      because the coordinate is sensitive - it is published in the vendor's own
      install script and its release manifest, and the host name carries no region.
      It has no default because a URL committed here would pin one version
      forever, and the pair (url, sha256) has to move together. Resolve both from
      the manifest at deploy time; the README carries the two commands. A
      "latest/" path is not a pin - KiroCliSha256 is what makes the build
      reproducible, and a mismatch fails the build rather than shipping an
      unreviewed binary.

  KiroCliSha256:
    Type: String
    Default: ""
    AllowedPattern: "^([a-fA-F0-9]{64})?$"
    Description: >-
      SHA-256 of the archive above. Take it from the release manifest's `sha256`
      field, or recompute it with `curl -sSL <url> | shasum -a 256`.
      REQUIRED for a build: the Dockerfile refuses to build without it.
      NoEcho is not set - a published artifact digest is not a secret.

  CreateRuntime:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Whether to create the AgentCore runtime in this pass. AgentCore validates
      the ECR pull AT CREATE TIME, so a runtime pointed at a tag that does not
      exist yet fails the resource and takes the stack with it - a first bring-up
      into an empty account therefore CANNOT be one pass. Deploy once with false
      to land the repository, roles, secrets, bucket and build project; push the
      image; then deploy again with true. Default true so a steady-state redeploy
      that omits the flag never deletes a live runtime.

  SourceType:
    Type: String
    Default: GITHUB
    # NO_SOURCE is deliberately absent: this project's BuildSpec is a PATH inside
    # the source tree, and CodeBuild requires an INLINE buildspec when there is no
    # source. A NO_SOURCE project built from this template could never run, so the
    # combination is rejected at parameter validation instead of at CreateProject.
    AllowedValues: [GITHUB, CODECOMMIT, S3, GITHUB_ENTERPRISE, BITBUCKET]
  SourceLocation:
    Type: String
    Default: ""
    Description: >-
      Repository or S3 location CodeBuild clones, and where BuildSpecPath is
      resolved. Required - every allowed SourceType needs one. It must point at a
      tree that actually CONTAINS packaging/agentcore-worker, which for an
      unpushed branch means either a fork you pushed it to or an S3 zip of the
      working tree.
  BuildSpecPath:
    Type: String
    Default: packaging/agentcore-worker/infra/buildspec.yml
  BuildImage:
    Type: String
    Default: aws/codebuild/amazonlinux2-aarch64-standard:3.0
    Description: Must be an ARM image - the worker image is arm64.
  BuildComputeType:
    Type: String
    Default: BUILD_GENERAL1_LARGE
    AllowedValues: [BUILD_GENERAL1_SMALL, BUILD_GENERAL1_MEDIUM, BUILD_GENERAL1_LARGE]
    Description: >-
      LARGE by default: the build downloads a 582 MiB archive and pushes a
      multi-hundred-MB image, and SMALL runs out of disk.

  NetworkMode:
    Type: String
    Default: PUBLIC
    AllowedValues: [PUBLIC, VPC]
    Description: >-
      PUBLIC is the default and needs no VPC resources. VPC is the egress-restricted
      variant: the runtime's ENIs land in VpcSubnetIds behind VpcSecurityGroupIds,
      which is where an egress allow-list (e.g. a Network Firewall in front of those
      subnets, as in the reference stack) becomes enforceable. AgentCore VPC mode
      needs at least two subnets in different AZs. Those network resources are NOT
      created here - supply them.
  VpcSubnetIds:
    Type: CommaDelimitedList
    Default: ""
  VpcSecurityGroupIds:
    Type: CommaDelimitedList
    Default: ""

  KiroApiKeySecretName:
    Type: String
    Default: cloud-mode/kiro-api-key
    Description: Model credential. The stack creates the SHELL; a human writes the value.
  ForgeAppIdSecretName:
    Type: String
    Default: cloud-mode/gh-app-id
  ForgeInstallationIdSecretName:
    Type: String
    Default: cloud-mode/gh-installation-id
  ForgePrivateKeySecretName:
    Type: String
    Default: cloud-mode/gh-app-private-key

  MaxActiveSessions:
    Type: Number
    Default: 8
    MinValue: 1
    MaxValue: 64
  SessionTtlSeconds:
    Type: Number
    Default: 3600
    MinValue: 60
    Description: How long a finished session stays in the worker's session map before it is evicted.
  ValidateCommand:
    Type: String
    Default: ""
    Description: >-
      Validation gate run on the resolved tree before anything is pushed
      (e.g. "npm ci && npm run lint && npm test"). Empty omits the variable, and
      the gate then always passes.

  TranscriptRetentionDays:
    Type: Number
    Default: 90
    MinValue: 1
    MaxValue: 3650
  LogRetentionDays:
    Type: Number
    Default: 90
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
  MonthlyBudgetUsd:
    Type: Number
    Default: 0
    MinValue: 0
    Description: 0 disables the budget. AWS Budgets notifies; it does not stop anything.
  BudgetEmail:
    Type: String
    Default: ""
    Description: Required for the budget to be created at all - a budget with no subscriber is useless.
  OperatorPrincipalArn:
    Type: String
    Default: ""
    Description: >-
      Principal allowed to assume the operator role. Empty falls back to this
      account's root, which is the narrowest sane default. Holding this role's
      invoke permission is effectively write access to every repository the forge
      app is installed on - grant it deliberately.

# Rules run before any resource is touched, so a coordinate that can only fail
# later fails here instead - with a sentence the operator can act on rather than a
# CreateProject or CreateAgentRuntime error a hundred lines into the event log.
Rules:
  SourceLocationIsRequired:
    Assertions:
      - Assert: !Not [!Equals [!Ref SourceLocation, ""]]
        AssertDescription: >-
          SourceLocation is required. Every allowed SourceType clones a tree, and
          BuildSpecPath is resolved inside it. Point it at a repository or S3 zip
          that contains packaging/agentcore-worker.

  # Neither is a secret, so naming them in a failure message is safe.
  ImagePinsAreRequiredTogether:
    Assertions:
      - Assert: !Or
          - !And [!Equals [!Ref KiroCliUrl, ""], !Equals [!Ref KiroCliSha256, ""]]
          - !And [!Not [!Equals [!Ref KiroCliUrl, ""]], !Not [!Equals [!Ref KiroCliSha256, ""]]]
        AssertDescription: >-
          KiroCliUrl and KiroCliSha256 must be supplied together. A URL without a
          digest builds whatever the host currently serves; a digest without a URL
          pins nothing. Both empty is allowed only for a stack whose build project
          will never be run.

Conditions:
  HasSuffix: !Not [!Equals [!Ref ResourceSuffix, ""]]
  IsVpcMode: !Equals [!Ref NetworkMode, "VPC"]
  # See the CreateRuntime parameter: the runtime is the one resource that cannot
  # be created before the image it pulls exists.
  IsRuntimeEnabled: !Equals [!Ref CreateRuntime, "true"]
  HasValidateCommand: !Not [!Equals [!Ref ValidateCommand, ""]]
  HasSourceLocation: !Not [!Equals [!Ref SourceLocation, ""]]
  HasOperatorPrincipal: !Not [!Equals [!Ref OperatorPrincipalArn, ""]]
  HasBudget: !And
    - !Not [!Equals [!Ref MonthlyBudgetUsd, 0]]
    - !Not [!Equals [!Ref BudgetEmail, ""]]

Resources:
  # ── Image repository ──────────────────────────────────────────────────────
  WorkerRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !If
        - HasSuffix
        - !Sub "${EcrRepositoryName}-${ResourceSuffix}"
        - !Ref EcrRepositoryName
      ImageTagMutability: !Ref ImageTagMutability
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        # Untagged layers are build debris; keep the tagged images.
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 14 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 14
                },
                "action": { "type": "expire" }
              }
            ]
          }

  # ── Secret SHELLS ─────────────────────────────────────────────────────────
  # Created empty, on purpose. No SecretString, no GenerateSecretString: a value
  # in a template is a value in the change set, the stack events and every
  # operator's shell history. Writing them is a human step (see infra/README.md).
  KiroApiKeySecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !If [HasSuffix, !Sub "${KiroApiKeySecretName}-${ResourceSuffix}", !Ref KiroApiKeySecretName]
      Description: Kiro API key for the agent child (KIRO_API_KEY). Value written out of band by a human.

  ForgeAppIdSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !If [HasSuffix, !Sub "${ForgeAppIdSecretName}-${ResourceSuffix}", !Ref ForgeAppIdSecretName]
      Description: Forge app id. Value written out of band by a human.

  ForgeInstallationIdSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !If
        - HasSuffix
        - !Sub "${ForgeInstallationIdSecretName}-${ResourceSuffix}"
        - !Ref ForgeInstallationIdSecretName
      Description: Forge app installation id. Value written out of band by a human.

  ForgePrivateKeySecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !If
        - HasSuffix
        - !Sub "${ForgePrivateKeySecretName}-${ResourceSuffix}"
        - !Ref ForgePrivateKeySecretName
      Description: Forge app private key (PEM). Value written out of band by a human.

  # ── Transcript archive ────────────────────────────────────────────────────
  # Private, encrypted, versioned, lifecycle-expired. One JSONL object per session
  # under a single prefix, written by the orchestrator identity. No bucket name is
  # given, so CloudFormation generates a unique one and the template stays free of
  # account-derived strings.
  TranscriptBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: { Status: Enabled }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      LifecycleConfiguration:
        Rules:
          - Id: ExpireTranscripts
            Status: Enabled
            Prefix: transcripts/
            ExpirationInDays: !Ref TranscriptRetentionDays
            NoncurrentVersionExpirationInDays: !Ref TranscriptRetentionDays
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }

  TranscriptBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TranscriptBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt TranscriptBucket.Arn
              - !Sub "${TranscriptBucket.Arn}/*"
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  # ── Worker log group ──────────────────────────────────────────────────────
  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !If [HasSuffix, !Sub "${LogGroupName}-${ResourceSuffix}", !Ref LogGroupName]
      RetentionInDays: !Ref LogRetentionDays

  # ── Runtime role ──────────────────────────────────────────────────────────
  # Assumed by AgentCore. Reads exactly the four secrets, pulls exactly this
  # repository, writes its own log group and the AgentCore log namespace, and puts
  # objects under exactly one transcript prefix. No bedrock:InvokeModel - see the
  # header comment on the dropped agent role.
  RuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: bedrock-agentcore.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
              ArnLike:
                "aws:SourceArn": !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*"
      Description: AgentCore runtime role - ECR pull, four secret reads, own logs, one transcript prefix
      Policies:
        - PolicyName: worker-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PullWorkerImage
                Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource: !GetAtt WorkerRepository.Arn
              # ecr:GetAuthorizationToken takes no resource - the API rejects any
              # ARN. This is the only wildcard-resource statement in the template
              # and it grants nothing but a registry login token.
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: ReadWorkerSecrets
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Ref KiroApiKeySecret
                  - !Ref ForgeAppIdSecret
                  - !Ref ForgeInstallationIdSecret
                  - !Ref ForgePrivateKeySecret
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${WorkerLogGroup}"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${WorkerLogGroup}:log-stream:*"
              # AgentCore creates its own log groups per runtime, so this grant is
              # a path prefix rather than one ARN - still a bounded namespace in
              # this account and region.
              - Sid: WriteAgentCoreLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/*:log-stream:*"
              # DescribeLogGroups cannot be scoped by the groups it returns; kept
              # separate, read-only, and visibly minimal.
              - Sid: DescribeLogGroups
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group::log-stream:"
              - Sid: WriteTranscripts
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${TranscriptBucket.Arn}/transcripts/*"
              - Sid: WorkloadIdentity
                Effect: Allow
                Action:
                  - bedrock-agentcore:GetWorkloadAccessToken
                  - bedrock-agentcore:GetWorkloadAccessTokenForJWT
                  - bedrock-agentcore:GetWorkloadAccessTokenForUserId
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default"
                  - !Sub >-
                      arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/${AgentRuntimeName}*

  # ── AgentCore runtime ─────────────────────────────────────────────────────
  # AgentCore provisions a DEFAULT endpoint for every runtime, so this template
  # must NOT create one (that fails with 409 AlreadyExists). Callers use the
  # built-in DEFAULT qualifier.
  #
  # AgentCore validates ECR pull access when the runtime is created, so the
  # runtime role and its policy must exist first. The reference CDK stack needed an
  # explicit dependency for that because CDK puts the policy in a separate
  # DefaultPolicy resource; here the policy is inline on the role, so
  # `RoleArn: !GetAtt RuntimeRole.Arn` already orders it and an explicit DependsOn
  # would be redundant (cfn-lint W3005).
  #
  # That same create-time validation is why this resource is CONDITIONAL. It reads
  # the ECR tag, so on a first bring-up into an empty account there is nothing to
  # read and the resource fails - which is a failed CREATE, not a running runtime
  # reporting a pull error. Phase one deploys with CreateRuntime=false, the image is
  # pushed, phase two deploys with CreateRuntime=true. DependsOn on the repository
  # would not help: the repository exists long before an image is in it.
  WorkerRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Condition: IsRuntimeEnabled
    Properties:
      AgentRuntimeName: !If
        - HasSuffix
        - !Sub "${AgentRuntimeName}_${ResourceSuffix}"
        - !Ref AgentRuntimeName
      Description: kiro-cli agent worker (clone, work the item, deliver - with live interaction)
      AgentRuntimeArtifact:
        ContainerConfiguration:
          ContainerUri: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${WorkerRepository}:${ImageTag}"
      NetworkConfiguration: !If
        - IsVpcMode
        - NetworkMode: VPC
          NetworkModeConfig:
            Subnets: !Ref VpcSubnetIds
            SecurityGroups: !Ref VpcSecurityGroupIds
        - NetworkMode: PUBLIC
      ProtocolConfiguration: HTTP
      RoleArn: !GetAtt RuntimeRole.Arn
      EnvironmentVariables:
        AWS_REGION: !Ref AWS::Region
        # Secret IDENTIFIERS (ARNs), never values. The orchestrator resolves each
        # one through Secrets Manager with the runtime role and keeps the material
        # in memory only.
        KIRO_API_KEY_SECRET: !Ref KiroApiKeySecret
        GH_APP_ID_SECRET: !Ref ForgeAppIdSecret
        GH_INSTALLATION_ID_SECRET: !Ref ForgeInstallationIdSecret
        GH_PRIVATE_KEY_SECRET: !Ref ForgePrivateKeySecret
        # Fail closed: refuse to run when untrusted code would share the
        # orchestrator's OS user, and require the session owner token.
        CLOUD_MODE_REQUIRE_UID_SANDBOX: "1"
        CLOUD_MODE_REQUIRE_OWNER_TOKEN: "1"
        # Sub, not Ref: this map's values must be strings.
        CLOUD_MODE_MAX_ACTIVE_SESSIONS: !Sub "${MaxActiveSessions}"
        CLOUD_MODE_SESSION_TTL_SECONDS: !Sub "${SessionTtlSeconds}"
        CLOUD_MODE_TRANSCRIPT_BUCKET: !Ref TranscriptBucket
        CLOUD_MODE_TRANSCRIPT_PREFIX: transcripts/
        CLOUD_MODE_LOG_GROUP: !Ref WorkerLogGroup
        # AWS::NoValue removes the key entirely when the gate is unset, rather
        # than setting it to the empty string.
        CLOUD_MODE_VALIDATE_CMD: !If [HasValidateCommand, !Ref ValidateCommand, !Ref "AWS::NoValue"]
        # NOTE for the worker stream: the reference implementation's
        # CLOUD_MODE_AGENT_ROLE_ARN / CLOUD_MODE_REQUIRE_SCOPED_CREDS pair is
        # intentionally absent because the scoped Bedrock agent role is dropped
        # (see the header). A vendored aws-identity.mjs that logs a DEGRADED
        # credential scope on their absence should say "not applicable: the agent
        # authenticates to Kiro with a bearer token, not to Bedrock with SigV4"
        # instead of implying a missing mitigation.

  # ── Operator role ─────────────────────────────────────────────────────────
  # What the local client needs, and nothing else: invoke and stop. No ECR, no
  # secrets, no logs, no S3.
  OperatorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !If
                - HasOperatorPrincipal
                - !Ref OperatorPrincipalArn
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
      Description: Permissions the local client needs to drive the worker runtime
      # The policy names the runtime's exact ARN, so it can only exist in a pass
      # that creates the runtime. In phase one the role is created empty rather
      # than granted a wildcard over `runtime/<name>-*` to keep the reference
      # resolvable - an operator role with no permissions is the honest state
      # while there is no runtime to invoke, and phase two fills it in. Do NOT
      # relax this to a prefix wildcard to make one-pass deploys work: the exact
      # ARN is what stops this role reaching a second runtime in the account.
      Policies: !If
        - IsRuntimeEnabled
        - - PolicyName: invoke-worker-runtime
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - bedrock-agentcore:InvokeAgentRuntime
                    - bedrock-agentcore:StopRuntimeSession
                  Resource:
                    - !GetAtt WorkerRuntime.AgentRuntimeArn
                    - !Sub "${WorkerRuntime.AgentRuntimeArn}/*"
        - !Ref "AWS::NoValue"

  # ── In-account image build ────────────────────────────────────────────────
  # Building in-account is what removes the need for a local container daemon and
  # a 582 MiB local pull. The build spec lives in this directory next to the
  # Dockerfile it builds.
  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      Description: Builds and pushes the arm64 worker image
      Policies:
        - PolicyName: build-and-push
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PushWorkerImage
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt WorkerRepository.Arn
              - Sid: BuildLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*:log-stream:*"

  ImageBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !If
        - HasSuffix
        - !Sub "${EcrRepositoryName}-image-${ResourceSuffix}"
        - !Sub "${EcrRepositoryName}-image"
      Description: Builds the arm64 AgentCore worker image and pushes it to ECR
      ServiceRole: !GetAtt BuildRole.Arn
      Artifacts: { Type: NO_ARTIFACTS }
      TimeoutInMinutes: 60
      Source:
        Type: !Ref SourceType
        # NO_SOURCE (or any type with no location yet) must omit Location
        # entirely - an empty string is rejected.
        Location: !If [HasSourceLocation, !Ref SourceLocation, !Ref "AWS::NoValue"]
        BuildSpec: !Ref BuildSpecPath
      Environment:
        # ARM_CONTAINER, because the image is arm64 and cross-building it under
        # emulation is slow enough to hit the build timeout.
        Type: ARM_CONTAINER
        Image: !Ref BuildImage
        ComputeType: !Ref BuildComputeType
        # Required to run `docker build` inside the build container.
        PrivilegedMode: true
        EnvironmentVariables:
          - { Name: AWS_ACCOUNT_ID, Value: !Ref AWS::AccountId }
          - { Name: ECR_REPOSITORY_NAME, Value: !Ref WorkerRepository }
          - { Name: IMAGE_TAG, Value: !Ref ImageTag }
          - { Name: WORKER_DIR, Value: packaging/agentcore-worker }
          - { Name: KIRO_CLI_URL, Value: !Ref KiroCliUrl }
          - { Name: KIRO_CLI_SHA256, Value: !Ref KiroCliSha256 }
      LogsConfig:
        CloudWatchLogs: { Status: ENABLED }

  # ── Cost visibility ───────────────────────────────────────────────────────
  # The session cap bounds how many agents run; the budget makes the spend they
  # cause visible. Advisory by nature - Budgets notifies, it does not stop.
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudget
    Properties:
      Budget:
        BudgetName: !If
          - HasSuffix
          - !Sub "agentcore-worker-monthly-${ResourceSuffix}"
          - agentcore-worker-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]

Outputs:
  Region:
    Description: Region this stack was deployed into
    Value: !Ref AWS::Region
  # The three runtime outputs are absent in a CreateRuntime=false pass. Their
  # absence is the signal that the stack is still in phase one: a client
  # configured from an output set with no AgentRuntimeArn has nothing to invoke,
  # which is better than an ARN that resolves to nothing.
  AgentRuntimeArn:
    Condition: IsRuntimeEnabled
    Value: !GetAtt WorkerRuntime.AgentRuntimeArn
  AgentRuntimeId:
    Condition: IsRuntimeEnabled
    Value: !GetAtt WorkerRuntime.AgentRuntimeId
  RuntimeEndpointName:
    Condition: IsRuntimeEnabled
    Description: AgentCore provisions this endpoint itself; the client uses this qualifier
    Value: DEFAULT
  RuntimeRoleArn:
    Value: !GetAtt RuntimeRole.Arn
  OperatorRoleArn:
    Value: !GetAtt OperatorRole.Arn
  EcrRepositoryUri:
    Value: !GetAtt WorkerRepository.RepositoryUri
  ImageBuildProjectName:
    Value: !Ref ImageBuildProject
  TranscriptBucketName:
    Value: !Ref TranscriptBucket
  WorkerLogGroupName:
    Value: !Ref WorkerLogGroup
  KiroApiKeySecretArn:
    Description: Shell only - write the value with `aws secretsmanager put-secret-value`
    Value: !Ref KiroApiKeySecret
  NetworkMode:
    Value: !Ref NetworkMode
